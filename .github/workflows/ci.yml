name: CI - guarda-chuva

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Sem os repositórios irmãos clonados ao lado, a checagem de tabelas e classes do
      # DER é pulada (Assumptions); contratos, matriz CQ e seções dos diagramas rodam sempre.
      - name: Contratos e documentação (quality/)
        run: ./mvnw -B -ntp -f quality/pom.xml verify
      - name: Arquivos compose válidos
        run: |
          docker compose --env-file .env.sprint0.example -f compose.sprint0.yaml config --quiet
          docker compose --env-file .env.sprint0.example -f compose.sprint0.yaml -f compose.jwt-rsa.yaml config --quiet
          IDENTIDADE_PROFILES=local-seed,jwt-rsa docker compose --env-file .env.sprint0.example -f compose.sprint0.yaml -f compose.sprint1-local.yaml -f compose.jwt-rsa.yaml config --quiet
