name: CI - guarda-chuva

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # A checagem de tabelas e classes do DER lê migrações e fontes dos repositórios
      # irmãos; clonados aqui, ela nunca é pulada no CI.
      - name: Clonar repositórios irmãos
        run: |
          mkdir -p "$RUNNER_TEMP/repos"
          for svc in gateway bff identidade frota operacoes indicadores function; do
            git clone --quiet --depth 1 --branch "${GITHUB_REF_NAME}" \
              "https://github.com/${GITHUB_REPOSITORY_OWNER}/nexfleet-${svc}.git" \
              "$RUNNER_TEMP/repos/nexfleet-${svc}" \
            || git clone --quiet --depth 1 \
              "https://github.com/${GITHUB_REPOSITORY_OWNER}/nexfleet-${svc}.git" \
              "$RUNNER_TEMP/repos/nexfleet-${svc}"
          done
      - name: Contratos e documentação (quality/)
        run: ./mvnw -B -ntp -f quality/pom.xml verify "-Dnexfleet.repos.dir=$RUNNER_TEMP/repos"
      - name: Arquivos compose válidos
        run: |
          docker compose --env-file .env.sprint0.example -f compose.sprint0.yaml config --quiet
          docker compose --env-file .env.sprint0.example -f compose.sprint0.yaml -f compose.jwt-rsa.yaml config --quiet
          IDENTIDADE_PROFILES=local-seed,jwt-rsa docker compose --env-file .env.sprint0.example -f compose.sprint0.yaml -f compose.sprint1-local.yaml -f compose.jwt-rsa.yaml config --quiet
